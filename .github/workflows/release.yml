name: Release

# The tag release-please creates when its release pull request is merged, such
# as v0.2.0, builds the binaries, attaches them to the GitHub release
# release-please created and pushes the image to ghcr.io/<owner>/docpipe.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  binaries:
    name: Binary ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95'

      - name: Check the tag against the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="docpipe-$TAG-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/docpipe" LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: docpipe-*.tar.gz*
          if-no-files-found: error

  release:
    name: Release assets
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  image_arch:
    name: Container image (${{ matrix.arch }})
    needs: binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push
        env:
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker build \
            --platform "$PLATFORM" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --tag "$image:$version-$ARCH" \
            .
          docker push "$image:$version-$ARCH"

  image_manifest:
    name: Multi-arch container image
    needs: image_arch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish amd64 and arm64 tags
        env:
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker buildx imagetools create \
            --tag "$image:$version" \
            --tag "$image:${version%.*}" \
            --tag "$image:latest" \
            "$image:$version-amd64" "$image:$version-arm64"
          docker buildx imagetools inspect "$image:$version"
