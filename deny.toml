[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
ignore = [
    # rsa only signs the tests' tokens; docpipe never decrypts with it.
    { id = "RUSTSEC-2023-0071", reason = "dev-dependency for test tokens, no decryption" },
    # Unmaintained, reached only through pdf-inspector's OCR stack (image, imageproc).
    { id = "RUSTSEC-2024-0436", reason = "paste is a proc macro of image's EXR decoder, no fix upstream" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser comes with imageproc's text drawing, no fix upstream" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CDLA-Permissive-2.0", "ISC", "MPL-2.0", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
