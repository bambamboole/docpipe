[package]
name = "docpipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Document analysis service: PDF classification, text with positions, OCR and e-invoice XML extraction"
license = "MIT"
repository = "https://github.com/bambamboole/docpipe"
publish = false

[dependencies]
axum = "0.8"
jsonwebtoken = "9"
lopdf = "0.45"
pdf-inspector = { version = "1.25", features = ["ocr"] }
regex = "1"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "logs", "panic", "rustls", "tracing", "ureq"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = "3"
utoipa = "6"
utoipa-axum = "0.3"

[dev-dependencies]
base64 = "0.22"
http-body-util = "0.1"
rand = "0.8"
rsa = "0.9"
tower = { version = "0.5", features = ["util"] }

[profile.dev.package.rsa]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
