[package]
name = "docpipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Document analysis service: PDF classification, text with positions, OCR and e-invoice XML extraction"
license = "MIT"
repository = "https://github.com/bambamboole/docpipe"
publish = false

[dependencies]
axum = "0.8"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
# pdf-inspector pins lopdf 0.45; a newer version here would put two lopdf crates into
# the binary. Bump both together.
lopdf = "0.45"
pdf-inspector = { version = "1.25", features = ["ocr"] }
regex = "1"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "logs", "panic", "rustls", "tracing", "ureq"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tower-http = { version = "0.7", features = ["limit", "request-id", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = "3"
utoipa = "6"
utoipa-axum = "0.3"

[dev-dependencies]
base64 = "0.23"
http-body-util = "0.1"
roxmltree = "0.21"
rsa = "0.9"
tower = { version = "0.5", features = ["util"] }

[profile.dev.package.rsa]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# File and line in Sentry backtraces; `panic = "abort"` would turn the panics
# that `spawn_blocking` isolates into process aborts.
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Geometry turns counts into f32 and millis into u64 on purpose.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"
